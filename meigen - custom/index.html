<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>迷言集</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <h1>迷言集</h1>
        <div class="left-box">
            <figure>
                <img src="images/syougi.jpg" alt="望月冬夜">
                <figcaption>望月冬夜</figcaption>
            </figure>
            <p>「僕達の魔力を奪って再生か……フッ……まるで将棋だな……そうか……『王』を取れば！」
            </p>
        </div>

        <div class="right-box">
            <figure>
                <img src="images/sute-tasu.jpg" alt="こなた">
                <figcaption>こなた</figcaption>
            </figure>
            <p>「貧乳はステータスだ！希少価値だ！」
            </p>
        </div>

        <div class="center-box">
            <figure>
                <img src="images/yurusite.jpg" alt="ゆっこ">
                <figcaption>ゆっこ</figcaption>
            </figure>
            <p>「許してヒヤシンス」</p>
        </div>
        <div class="center-box">
            <figure>
                <img src="images/memeta.jpg" alt="ジョジョの奇妙な冒険">
                <figcaption>ジョジョの奇妙な冒険</figcaption>
            </figure>
            <p>「メメタァ」</p>
        </div>
        <div class="center-box">
            <figure>
                <img src="images/syougakusei.jpg" alt="長谷川昴">
                <figcaption>長谷川昴</figcaption>
            </figure>
            <p>「この短期間でここまでシュートやパスの精度が上げられる吸収力。まったく、小学生は最高だぜ!! 」</p>
        </div>
        <div class="center-box">
            <figure>
                <img src="images/asobi.jpg" alt="華子">
                <figcaption>華子</figcaption>
            </figure>
            <p>「アポクリン汗腺！！！」</p>
        </div>
        <div class="center-box">
            <figure>
                <img src="images/hannzai.jpg" alt="ニャル子">
                <figcaption>ニャル子</figcaption>
            </figure>
            <p>「バレなきゃ犯罪じゃないんですよ」</p>
        </div>
    </div>

</body>

</html>
